<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6bff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘배송">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>오늘배송</title>
<style>
:root{
  --blue:#246BFE;--blue2:#0F55D9;--bg:#F5F7FB;--card:#fff;--text:#121826;--muted:#6B7280;
  --line:#E5E7EB;--red:#FF3B4F;--orange:#FF9F0A;--green:#19B36B;--shadow:0 8px 24px rgba(15,23,42,.08)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:var(--text)}
.app{max-width:460px;margin:0 auto;min-height:100vh;background:linear-gradient(#fff 0,#F7F9FF 180px,#F5F7FB 420px);padding-bottom:92px}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.92);backdrop-filter:blur(16px);padding:12px 16px 10px;border-bottom:1px solid rgba(229,231,235,.7)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:900;font-size:25px;letter-spacing:-1.6px}.logo span{color:var(--blue)}
.iconbtn{width:38px;height:38px;border:0;background:#F1F5F9;border-radius:14px;font-size:20px;position:relative}
.badge{position:absolute;right:-3px;top:-4px;background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:2px 6px;font-weight:800}
.search{margin-top:12px;height:46px;background:#F8FAFC;border:1px solid #DDE3EE;border-radius:16px;display:flex;align-items:center;padding:0 13px;gap:8px;color:#8A94A6}
.search input{border:0;background:transparent;outline:0;font-size:15px;width:100%}
.addr{margin:10px 16px;background:#fff;border:1px solid #E8ECF4;border-radius:15px;padding:12px;display:flex;align-items:center;gap:9px;box-shadow:0 4px 16px rgba(15,23,42,.04)}
.addr b{font-size:14px}.addr small{color:#666;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:290px}
.cats{display:flex;gap:14px;padding:10px 16px 14px;overflow:auto}.cat{text-align:center;min-width:58px;font-size:12px;color:#374151}.cat .cicon{width:54px;height:54px;background:#fff;border-radius:18px;display:grid;place-items:center;font-size:26px;margin-bottom:6px;box-shadow:0 4px 14px rgba(15,23,42,.06)}
.banner{margin:0 16px 14px;border-radius:22px;background:linear-gradient(135deg,#E3F1FF,#BFD8FF);height:142px;padding:20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.banner h2{margin:0;font-size:25px;letter-spacing:-1.2px}.banner p{margin:8px 0 0;color:#4B5563}.truck{position:absolute;right:20px;bottom:18px;font-size:58px;filter:drop-shadow(0 10px 12px rgba(37,99,235,.25))}
.quick{margin:0 16px 18px;background:#fff;border-radius:20px;padding:14px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}.quick div{font-size:12px}.quick b{display:block;font-size:24px;margin-bottom:5px}
.section{padding:0 16px;margin-top:14px}.section h2{font-size:22px;margin:0 0 11px;letter-spacing:-1px}.hrow{display:flex;justify-content:space-between;align-items:center}.more{color:#7B8190;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.product{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 5px 18px rgba(15,23,42,.07);position:relative}.photo{height:142px;background:#EEF2F7;display:grid;place-items:center;font-size:56px;position:relative}.sale{position:absolute;left:8px;top:8px;background:var(--red);color:#fff;border-radius:9px;padding:5px 7px;font-size:12px;font-weight:900}.heart{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.9);border:0;border-radius:999px;width:32px;height:32px;font-size:18px}
.info{padding:10px}.name{font-size:14px;line-height:1.25;height:35px;overflow:hidden}.price{font-weight:900;font-size:17px;margin-top:6px}.del{font-size:12px;color:#7C8DA6;margin-top:4px}.rating{font-size:12px;color:#4B5563;margin-top:5px}.add{margin-top:9px;width:100%;border:0;background:#EEF4FF;color:var(--blue);border-radius:11px;padding:9px;font-weight:800}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:460px;width:100%;height:76px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid #E5E7EB;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:20}.nav button{border:0;background:transparent;color:#6B7280;font-size:11px}.nav b{display:block;font-size:23px;margin-bottom:2px}.nav .on{color:var(--blue);font-weight:900}
.page{display:none}.page.on{display:block}
.panel{margin:16px;background:#fff;border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.cartitem{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #EDF0F5}.thumb{width:64px;height:64px;border-radius:14px;background:#EEF2F7;display:grid;place-items:center;font-size:32px}.ci{flex:1}.ci b{font-size:14px}.ci p{margin:5px 0;color:#555;font-size:13px}
.primary{border:0;background:var(--blue);color:#fff;border-radius:15px;padding:14px;font-weight:900;width:100%;font-size:16px}.ghost{border:1px solid #D8E0EE;background:#fff;color:#374151;border-radius:14px;padding:12px;font-weight:800;width:100%}
.input{width:100%;border:1px solid #D9E0EC;border-radius:14px;padding:13px;font-size:15px;margin:6px 0 10px;background:#F9FAFB}
.stage{display:flex;gap:10px;margin:14px 0}.dot{width:28px;height:28px;border-radius:50%;background:#E5E7EB;display:grid;place-items:center;font-size:13px}.stage.done .dot{background:#DDFBEA;color:#0A8F55}.stage.now .dot{background:var(--blue);color:#fff}.stage p{margin:0}.stage small{color:#777}.line{height:8px;background:#E8EEFA;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#2F6BFF,#6EA6FF);width:0%;transition:.5s}
.notice{background:#FFF7E7;border:1px solid #FFE2A8;border-radius:16px;padding:12px;font-size:13px;color:#7A4C00;margin-top:12px}
.review{display:flex;gap:10px;margin:12px 0;border-top:1px solid #EEF0F4;padding-top:12px}.avatar{width:38px;height:38px;border-radius:50%;background:#EAF0FF;display:grid;place-items:center}.review p{margin:3px 0 0;font-size:13px;color:#444}.reviewpic{margin-top:7px;border-radius:12px;background:#EEF2F7;height:78px;display:grid;place-items:center;font-size:34px}
.coupon{background:linear-gradient(135deg,#111827,#374151);color:#fff;border-radius:18px;padding:16px;margin:10px 0}.coupon b{font-size:20px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:#111827;color:white;padding:12px 16px;border-radius:999px;opacity:0;transition:.25s;z-index:99;font-size:14px}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head><body><div class="app">
  <div class="top">
    <div class="row"><button class="iconbtn" onclick="toast('준비 중인 메뉴예요')">☰</button><div class="logo"><span>오늘</span>배송 🚀</div><button class="iconbtn" onclick="go('cart')">🛒<em class="badge" id="cartBadge">0</em></button></div>
    <div class="search">🔎 <input id="search" placeholder="먹을거리, 옷, 가구, 물건 검색" oninput="renderProducts()"></div>
  </div>

  <main id="home" class="page on">
    <div class="addr" onclick="go('mypage')">🏠 <div><b>배송지</b><small id="addrText">우리집을 설정해 주세요</small></div><span style="margin-left:auto">›</span></div>
    <div class="cats" id="cats"></div>
    <div class="banner"><h2>오늘 주문하면<br>내일 도착!</h2><p>가상 배송으로 기분만 채우기</p><div class="truck">🚚</div></div>
    <div class="quick"><div><b>🏷️</b>특가</div><div><b>🚀</b>빠른배송</div><div><b>🎁</b>쿠폰</div><div><b>❤️</b>찜</div></div>
    <div class="section"><div class="hrow"><h2>오늘의 특가</h2><span class="more">전체보기 ›</span></div><div class="grid" id="products"></div></div>
  </main>

  <main id="category" class="page"><div class="section"><h2>카테고리</h2><div class="grid" id="catProducts"></div></div></main>
  <main id="searchPage" class="page"><div class="section"><h2>검색</h2><div class="panel"><input class="input" id="search2" placeholder="검색어 입력" oninput="document.getElementById('search').value=this.value;renderProducts();go('home')"></div></div></main>

  <main id="cart" class="page"><div class="panel"><h2>장바구니</h2><div id="cartList"></div><h3 id="total">0원</h3><button class="primary" onclick="fakePay()">가짜 주문하기</button><div class="notice">실제 결제, 실제 배송, 실제 개인정보 전송은 없습니다. 이 앱 안에서만 작동해요.</div></div></main>

  <main id="orders" class="page"><div class="panel"><h2>주문내역</h2><div id="orderList">아직 주문이 없어요.</div></div><div class="panel"><h2>배송조회</h2><div class="line"><div class="bar" id="bar"></div></div><div id="stages"></div></div></main>

  <main id="mypage" class="page">
    <div class="panel"><h2>우리집 설정</h2><input class="input" id="addrInput" placeholder="예: 부산 해운대구 센텀중앙로 90, 101동 1203호"><button class="primary" onclick="saveAddr()">저장하기</button></div>
    <div class="panel"><h2>쿠폰함</h2><div class="coupon"><small>오늘만</small><br><b>7,000원 할인쿠폰</b><p>가상 주문 전용</p></div><div class="coupon"><small>랜덤</small><br><b>무료배송 쿠폰</b><p>어차피 무료지만 기분용</p></div></div>
  </main>
</div>
<div class="nav">
<button class="on" onclick="go('home',this)"><b>🏠</b>홈</button><button onclick="go('category',this)"><b>▦</b>카테고리</button><button onclick="go('searchPage',this)"><b>🔎</b>검색</button><button onclick="go('orders',this)"><b>📦</b>주문내역</button><button onclick="go('mypage',this)"><b>👤</b>마이</button>
</div><div class="toast" id="toast"></div>
<script>
const cats=[['전체','🧩'],['식품','🍗'],['패션','👕'],['가구','🛋️'],['디지털','💻'],['생활','🧴'],['간식','🍪']];
const products=[
['교촌 스타일 허니콤보 윙감자','식품','🍗',18900,35,4.8,2351],['매운 라면 5개입','식품','🍜',3900,22,4.9,8721],['데일리 오버핏 반팔티','패션','👕',12900,30,4.7,1245],['마일로 3인용 소파','가구','🛋️',259000,26,4.8,732],
['블랙 라인 스니커즈','패션','👟',69000,18,4.8,3421],['아이스 아메리카노 Tall','식품','🥤',4100,8,4.9,9876],['와이드 연청 데님','패션','👖',59000,15,4.6,532],['데스크 컴퓨터 책상 1200','가구','🖥️',139000,17,4.8,421],
['무선 노이즈 이어폰','디지털','🎧',79000,24,4.7,1921],['저소음 키보드','디지털','⌨️',45900,19,4.8,1102],['향 좋은 샴푸 500ml','생활','🧴',8900,12,4.6,891],['프리미엄 호텔 수건 5장','생활','🧺',24900,20,4.9,552],
['크림치즈 베이글 세트','식품','🥯',11900,21,4.7,721],['원목 수납장 4단','가구','🗄️',89000,16,4.6,273],['미니 가습기','디지털','💧',22900,28,4.5,832],['초코 쿠키 박스','간식','🍪',9900,25,4.9,3281],
['기본 후드집업','패션','🧥',39900,14,4.7,814],['게이밍 마우스','디지털','🖱️',32900,31,4.8,1804],['치킨텐더 1kg','식품','🍖',14900,23,4.6,1420],['편한 사무용 의자','가구','🪑',119000,18,4.7,620]
];
let cart=JSON.parse(localStorage.cart||'[]'), orders=JSON.parse(localStorage.orders||'[]'), addr=localStorage.addr||'';
let selectedCat='전체';
function won(n){return n.toLocaleString()+'원'}
function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
function go(id,btn){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on')); if(btn)btn.classList.add('on'); renderCart(); renderOrders();}
function renderCats(){catsEl=document.getElementById('cats');catsEl.innerHTML='';cats.forEach(c=>{let d=document.createElement('div');d.className='cat';d.innerHTML=`<div class=cicon>${c[1]}</div>${c[0]}`;d.onclick=()=>{selectedCat=c[0];renderProducts();};catsEl.appendChild(d)})}
function productCard(p,i){return `<div class=product onclick="detail(${i})"><div class=photo><span class=sale>${p[4]}%</span><button class=heart onclick="event.stopPropagation();toast('찜했어요')">♡</button>${p[2]}</div><div class=info><div class=name>${p[0]}</div><div class=price>${won(p[3])}</div><div class=del>🚀 오늘배송</div><div class=rating>⭐ ${p[5]} (${p[6].toLocaleString()})</div><button class=add onclick="event.stopPropagation();add(${i})">담기</button></div></div>`}
function renderProducts(){let q=document.getElementById('search').value||'';let arr=products.map((p,i)=>[p,i]).filter(x=>(selectedCat=='전체'||x[0][1]==selectedCat)&&x[0][0].includes(q));document.getElementById('products').innerHTML=arr.map(x=>productCard(x[0],x[1])).join('');document.getElementById('catProducts').innerHTML=products.map((p,i)=>productCard(p,i)).join('')}
function detail(i){let p=products[i]; toast('상품 상세를 열었어요'); document.getElementById('products').insertAdjacentHTML('beforebegin',''); alert(`${p[0]}\n\n가격 ${won(p[3])}\n별점 ${p[5]}\n\n후기\n“포장 깔끔하고 생각보다 괜찮아요.”\n“사진이랑 느낌 비슷하고 배송 표시 보는 재미가 있음.”`)}
function add(i){cart.push(products[i]);localStorage.cart=JSON.stringify(cart);updateBadge();toast('장바구니에 담았어요')}
function updateBadge(){document.getElementById('cartBadge').textContent=cart.length}
function renderCart(){let l=document.getElementById('cartList'); if(!l)return; if(!cart.length){l.innerHTML='비어있어요';} else l.innerHTML=cart.map((p,i)=>`<div class=cartitem><div class=thumb>${p[2]}</div><div class=ci><b>${p[0]}</b><p>${won(p[3])}</p><button class=ghost onclick="cart.splice(${i},1);localStorage.cart=JSON.stringify(cart);renderCart();updateBadge()">삭제</button></div></div>`).join('');document.getElementById('total').textContent='총 '+won(cart.reduce((a,p)=>a+p[3],0))}
function fakePay(){if(!cart.length){toast('장바구니가 비었어요');return} let order={id:Date.now(),items:cart,addr:addr||'우리집 미설정',step:0,time:new Date().toLocaleString('ko-KR')};orders.unshift(order);cart=[];localStorage.cart='[]';localStorage.orders=JSON.stringify(orders);updateBadge();go('orders');startDelivery();toast('주문이 접수됐어요')}
function renderOrders(){let ol=document.getElementById('orderList'); if(!ol)return; if(!orders.length){ol.innerHTML='아직 주문이 없어요.';return} ol.innerHTML=orders.map(o=>`<div class=cartitem><div class=thumb>📦</div><div class=ci><b>${o.items.length}개 상품</b><p>${o.time}<br>${o.addr}</p></div></div>`).join(''); renderStages();}
function startDelivery(){let s=0; let timer=setInterval(()=>{if(!orders.length){clearInterval(timer);return} orders[0].step=s; localStorage.orders=JSON.stringify(orders);renderStages();s++;if(s>5)clearInterval(timer)},900)}
function renderStages(){let names=['주문 접수','상품 준비중','물류센터 출발','우리 동네 도착','우리집 앞 이동중','문 앞 배송완료'];let step=orders[0]?.step||0;document.getElementById('bar').style.width=(step/5*100)+'%';document.getElementById('stages').innerHTML=names.map((n,i)=>`<div class="stage ${i<step?'done':i==step?'now':''}"><div class=dot>${i<step?'✓':i+1}</div><div><p><b>${n}</b></p><small>${i==4?(addr||'우리집')+' 근처로 이동 중':i==5?'문 앞에 도착했어요':'상태가 업데이트됩니다'}</small></div></div>`).join('')}
function saveAddr(){addr=document.getElementById('addrInput').value.trim(); if(!addr){toast('주소를 입력해줘');return} localStorage.addr=addr;document.getElementById('addrText').textContent=addr;toast('우리집 저장 완료')}
if(addr){document.getElementById('addrText').textContent=addr;document.getElementById('addrInput').value=addr}
renderCats();renderProducts();renderCart();renderOrders();updateBadge();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body></html>
